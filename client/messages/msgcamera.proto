syntax = "proto3";
package messages;
// import "github.com/AsynkronIT/protoactor-go/actor/protos.proto";
option go_package = "github.com/dumacp/go-hikvision/client/messages";



// message Inputs {
// 	uint32 value = 1;
// }

// message Outputs {
// 	uint32 value = 1;
// }

message Event {
	enum EventType {
		INPUT = 0;
		OUTPUT = 1;
		SCENE = 2;
		TAMPERING = 3;
	}
	EventType type = 1;
	int64 value = 2;
	int32 ID = 3;
	// timestamp del evento en segundos Unix, tomado del dateTime que envia la camara.
	// Es el reloj de la camara, que es el mismo que indexa sus grabaciones: por eso
	// sirve para pedir el recorte de video aunque ese reloj este corrido.
	int64 timestamp = 4;
	// uid identifica de forma inequivoca este paso contado. Viaja al evento de MQTT y
	// al nombre del sidecar del clip, y es la llave con la que la plataforma une ambos.
	string uid = 5;
	// delta dice que `value` es un INCREMENTO y no el acumulado de la camara.
	//
	// La DS-2XM6825G0 reporta acumulados del dia y CountingActor obtiene el paso
	// restando contra el ultimo valor guardado. La DS-2XM6825G1 no expone un acumulado:
	// manda el conteo de una ventana de tiempo (eventType "counting"), y ese numero YA
	// es el incremento. Sin esta marca habria que mantener un acumulado sintetico en
	// memoria, que tras cada reinicio del binario arranca desfasado del valor persistido
	// y hace que la primera ventana se descarte.
	//
	// Un evento viejo reproducido desde la boltdb no trae el campo, asi que vale false y
	// el camino de siempre queda igual.
	bool delta = 6;
}

message Snapshot {
	int64 Inputs = 1;
	int64 Outputs = 2;
	int64 RawInputs = 3;
	int64 RawOutputs = 4; 
	int64 AllInputs = 5;
	int64 AllOutputs = 6; 
	map<int32, int64> inputsMap = 11;
  	map<int32, int64> outputsMap = 12;
  	map<int32, int64> rawInputsMap = 13;
  	map<int32, int64> rawOutputsMap = 14;
  	map<int32, int64> allInputsMap = 15;
  	map<int32, int64> allOutputsMap = 16;
  	map<int32, int64> tamperingMap = 17;
}

message CountingActor {
	string Address = 1;
	string ID = 2;
}

message CameraConfig {
	string Url = 1;
	string Hostname = 2;
	string Port = 3;
	string IP = 4;
}



//Service interface
message Start {}

message Stop {}

message Restart {}

message StatusRequest {}
message StatusResponse {
    string state = 1;
}

message InfoCounterRequest {}
message InfoCounterResponse {
    int64 Inputs = 1;
    int64 Outputs = 2;
}


